# -----------------------------------------------------
# Window rules
# -----------------------------------------------------

windowrule = tile 1, match:title ^(Microsoft-edge)$
windowrule = tile 1, match:title ^(Brave-browser)$
windowrule = tile 1, match:title ^(Chromium)$
windowrule = float 1, match:title ^(pavucontrol)$
windowrule = float 1, match:title ^(blueman-manager)$
windowrule = float 1, match:title ^(nm-connection-editor)$
windowrule = float 1, match:title ^(qalculate-gtk)$

# Browser Picture in Picture
windowrule = float 1, pin 1, move 69.5% 4%, match:title ^(Picture-in-Picture)$

windowrule = float 1, pin 1, stay_focused 1, decorate 0, no_blur 1, xray 1, no_shadow 1, match:class ulauncher

# idleinhibit
windowrule = idle_inhibit fullscreen, match:class ([window]) # Available modes: none, always, focus, fullscreen

#xwayland related rules
# when moving objects in resolve a large border is produced
# This rule prevents that and serves as a template for any problematic xwayland apps
windowrule = no_blur 1, match:class ^(\bresolve\b)$, match:xwayland 1
# This is a general rule for xwayland apps but can have other consequences
# for one user it impacted EMACs so it's disabled by default
# It's here as a reference or for quick triage of xwayland ap
#windowrule = noblur, xwayland:1
