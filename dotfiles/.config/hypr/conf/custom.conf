# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty
#
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL version
# env = SDL_VIDEODRIVER,wayland
misc{
    allow_session_lock_restore = true
    vrr = 1
}
# env = SDL_VIDEODRIVER,x11

# No Hardware Cursor
cursor {
    no_hardware_cursors = false
}
render {
    direct_scanout = 1
    cm_auto_hdr = 1
}
# Blur for waybar
#layerrule = blur, waybar
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, float 0, match:workspace w[tv1], match:float 0
windowrule = rounding 0, float 0, match:workspace w[tv1], match:float 0
windowrule = border_size 0, float 0, match:workspace f[1], match:float 0
windowrule = rounding 0, float 0, match:workspace f[1], match:float 0
debug {
    full_cm_proto=true
}

plugin {
    hyprbars {
        bar_height = 30
        bar_buttons_alignment = left
        bar_blur = true
        icon_on_hover = true
        bar_padding = 7
        inactive_button_color = rgba(00000040)
        hyprbars-button = rgb(ff4040), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(eeee11), 13, ━, hyprctl dispatch exec ~/.config/hypr/scripts/specialworkspace.sh
        hyprbars-button = rgb(40ff40), 13, ⛶, hyprctl dispatch fullscreen 1
        on_double_click = hyprctl dispatch fullscreen 1
    }
    hyprglass {
        layers:enabled = true
    }
}

#for libadwaita gtk4 apps you can use this command:
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#for gtk3 apps you need to install adw-gtk3 theme (in arch linux sudo pacman -S adw-gtk-theme)
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
# env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme
windowrule = immediate 1, float 1, size 607 1080, match:class gamescope

windowrule = float 1, size 562 1000, match:class Waydroid

# General Rules (Workspace, Float, No Decorations)
# This uses the common regex to match all 6 VMs.
windowrule = workspace 10, float 1, decorate 0, rounding 0, opaque 1, no_shadow 1, no_dim 1, match:title ^(QEMU \(vm[1-6]\))$

# --- Individual Placement Rules (3 columns, 2 rows) ---
# Each VM requires two separate rules for size and move.

# VM 1: Top Left (X=0, Y=0)
windowrule = size 640 540, move 0 0, match:title ^(QEMU \(vm1\))$
# VM 2: Top Middle (X=640, Y=0)
windowrule = size 640 540, move 640 0, match:title ^(QEMU \(vm2\))$
# VM 3: Top Right (X=1280, Y=0)
windowrule = size 640 540, move 1280 0, match:title ^(QEMU \(vm3\))$
# VM 4: Bottom Left (X=0, Y=540)
windowrule = size 640 540, move 0 540, match:title ^(QEMU \(vm4\))$
# VM 5: Bottom Middle (X=640, Y=540)
windowrule = size 640 540, move 640 540, match:title ^(QEMU \(vm5\))$
# VM 6: Bottom Right (X=1280, Y=540)
windowrule = size 640 540, move 1280 540, match:title ^(QEMU \(vm6\))$

#ulauncher rules
windowrule = float 1, pin 1, stay_focused 1, decorate 0, no_blur 1, xray 1, no_shadow 1, dim_around 1, center 1, match:class ulauncher

windowrule = match:class steam, workspace 2, no_initial_focus 1

exec-once = sunshine
exec-once = pidof hyprlock || hyprlock

